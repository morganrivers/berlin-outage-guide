# Keeps the "offline-pack" release up to date: the mini zip on every change to main,
# the full zip (adds 1 GB of medical Wikipedia) on the 1st of each month or when started by hand.
name: offline pack
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: offline-pack
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the zips
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then full=""; else full="--full"; fi
          python3 -I outage_guide.py pack dist $full
      - name: Upload to the offline-pack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view offline-pack >/dev/null 2>&1 || gh release create offline-pack --title "Offline pack" \
            --notes "Zips of the guide for offline use. The mini pack is rebuilt on every change, the full pack monthly."
          gh release upload offline-pack dist/*.zip --clobber
